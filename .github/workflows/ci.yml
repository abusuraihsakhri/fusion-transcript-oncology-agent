name: Test Python and browser demonstrations

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
          python -m pip check
      - name: Compile Python source
        run: python -m compileall -q agents fusion_transcript_oncology_agent cli.py fusion_mind.py enrichment.py
      - name: Run test suite
        run: python -m pytest -q
        env:
          AUDIT_SECRET_KEY: ci-only-regression-audit-key-${{ github.run_id }}-${{ github.run_attempt }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Run browser engine tests
        run: node --test tests/web.test.cjs
