name: Test Python and browser demonstrations

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
          python -m pip check
      - name: Compile Python source
        run: python -m compileall -q agents fusion_transcript_oncology_agent cli.py fusion_mind.py enrichment.py
      - name: Run test suite
        run: python -m pytest -q
        env:
          AUDIT_SECRET_KEY: ci-only-regression-audit-key-${{ github.run_id }}-${{ github.run_attempt }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Run browser engine tests
        run: node --test tests/web.test.cjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t fusion-demo-ci .
      - name: Smoke-test protected local API
        run: |
          docker run -d --name fusion-demo-ci -p 127.0.0.1:8765:8000 \
            -e AUDIT_SECRET_KEY=ci-test-only-audit-key-long-enough \
            -e API_ACCESS_TOKEN=ci-test-only-access-token fusion-demo-ci
          trap 'docker rm -f fusion-demo-ci' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/health
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"task_id":"TEST","target_identifier":"SYNTH","primary_metric":10}' \
            http://127.0.0.1:8765/api/audit)
          test "$code" = "401"
          curl -fsS -H "X-API-Key: ci-test-only-access-token" \
            -H "Content-Type: application/json" \
            -d '{"task_id":"TEST","target_identifier":"SYNTH","primary_metric":10}' \
            http://127.0.0.1:8765/api/audit
