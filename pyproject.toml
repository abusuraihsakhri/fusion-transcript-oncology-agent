[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-transcript-oncology-engine"
version = "2.0.0"
description = "FusionMind: RNA-Seq & NGS Oncogenic Gene Fusion Actionability Classifier"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.4,<3"]

[project.scripts]
fusion-transcript-oncology-engine = "fusion_transcript_oncology_agent.cli:main"
fusion-transcript-oncology-agent = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/fusion-transcript-oncology-agent"
Repository = "https://github.com/abusuraihsakhri/fusion-transcript-oncology-agent"

[project.optional-dependencies]
api = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["agents", "fusion_transcript_oncology_agent"]
py-modules = ["cli", "fusion_mind", "enrichment", "simulator"]
